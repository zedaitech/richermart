[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Friendly public routes → functions.
# Use `*` splat (not `:id`) — the :id placeholder was not being forwarded
# to the function's query string consistently on Netlify production.

[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200

[[redirects]]
  from = "/api/rx-upload"
  to = "/.netlify/functions/rx-upload"
  status = 200

# /api/rx/:id  and  /api/assets/:id  are served by v2 Functions with their
# own `export const config = { path: ... }` routing — no redirect needed.

[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/admin/upload"
  to = "/.netlify/functions/admin-upload"
  status = 200

[[redirects]]
  from = "/api/admin/store"
  to = "/.netlify/functions/admin-store"
  status = 200

# /api/admin/categories and /api/admin/items (+ their :id variants) are
# served by v2 Functions with their own `export const config = { path: ... }`
# routing — no redirect needed.

# Keep seeder out of search engines if site is public
[[headers]]
  for = "/admin/seed.mjs"
  [headers.values]
    X-Robots-Tag = "noindex"
